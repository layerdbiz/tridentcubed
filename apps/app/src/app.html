<!doctype html>
<html
	lang="en"
	data-theme
>
	<head>
		<meta charset="utf-8" />
		<link
			rel="icon"
			href="%sveltekit.assets%/favicon.svg"
		/>
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
		/>
		<!-- The installable app (#200); the addresses are install.constants.ts's, held to it by a test. -->
		<link
			rel="manifest"
			href="/manifest.webmanifest"
		/>
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="%sveltekit.assets%/install/apple-touch-icon.png"
		/>
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
