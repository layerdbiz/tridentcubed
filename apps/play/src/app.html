<!doctype html>
<html
	lang="en"
	data-theme
>
	<head>
		<meta charset="utf-8" />
		<link
			rel="icon"
			href="%sveltekit.assets%/favicon.svg"
		/>
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
		/>
		<!-- play.tridentcubed.com stays out of search engines (#342); vercel.json sends the same as a header. -->
		<meta
			name="robots"
			content="noindex, nofollow"
		/>
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
