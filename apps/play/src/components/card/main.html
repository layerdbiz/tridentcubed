<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1"
		/>
		<meta
			name="robots"
			content="noindex, nofollow"
		/>
		<title>Card: Main</title>
		<!-- A component that answers to its CONTAINER, not the screen (#342): the cards sit in the box marked
     data-container, and change shape when that box narrows. Turn on Container in play's controls and move its width
     to see it while the screen stays the same. Made-up project names only. -->
		<style>
			:root {
				--bg: #f1f5f9;
				--card: #fff;
				--fg: #0f172a;
				--muted: #64748b;
				--line: #e2e8f0;
				--primary: #2563eb;
				color-scheme: light;
			}
			:root[data-theme='dark'] {
				--bg: #0a101c;
				--card: #131c2e;
				--fg: #e6ebf2;
				--muted: #96a3b5;
				--line: #243044;
				--primary: #60a5fa;
				color-scheme: dark;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				padding: 24px;
				background: var(--bg);
				color: var(--fg);
				font:
					15px/1.4 system-ui,
					-apple-system,
					'Segoe UI',
					Roboto,
					sans-serif;
			}
			.cards {
				container-type: inline-size;
				display: grid;
				gap: 12px;
			}
			.card {
				display: grid;
				grid-template-columns: 1fr;
				gap: 10px;
				padding: 14px;
				border: 1px solid var(--line);
				border-radius: 14px;
				background: var(--card);
			}
			.thumb {
				aspect-ratio: 16 / 9;
				border-radius: 10px;
				background: linear-gradient(135deg, #93c5fd, #2563eb);
			}
			.title {
				margin: 0;
				font-size: 16px;
				font-weight: 700;
			}
			.meta {
				margin: 2px 0 0;
				color: var(--muted);
				font-size: 13px;
			}
			.tag {
				justify-self: start;
				padding: 3px 10px;
				border-radius: 999px;
				background: color-mix(in srgb, var(--primary), transparent 85%);
				color: var(--primary);
				font-size: 12px;
				font-weight: 700;
			}
			@container (min-width: 520px) {
				.card {
					grid-template-columns: 160px 1fr auto;
					align-items: center;
				}
				.thumb {
					aspect-ratio: 4 / 3;
				}
				.tag {
					justify-self: end;
				}
			}
			.width {
				margin: 0 0 10px;
				color: var(--muted);
				font-size: 12px;
			}
		</style>
	</head>
	<body>
		<p class="width">Narrow container: stacked. Wider than 520 px: one row.</p>
		<div
			class="cards"
			data-container
		>
			<article class="card">
				<div class="thumb"></div>
				<div>
					<p class="title">Sample Project 101</p>
					<p class="meta">Port A to Yard B · 3 stops</p>
				</div>
				<span class="tag">In progress</span>
			</article>
			<article class="card">
				<div class="thumb"></div>
				<div>
					<p class="title">Sample Project 102</p>
					<p class="meta">Yard B to Depot C · 1 stop</p>
				</div>
				<span class="tag">Draft</span>
			</article>
		</div>
	</body>
</html>
