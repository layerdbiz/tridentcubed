<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1"
		/>
		<meta
			name="robots"
			content="noindex, nofollow"
		/>
		<title>Button: Main</title>
		<!-- A component variant for play (#342): one plain HTML file. The shell sets data-theme on <html> for Light and
     Dark; made-up labels only. -->
		<style>
			:root {
				--bg: #f8fafc;
				--fg: #0f172a;
				--muted: #64748b;
				--primary: #2563eb;
				--on-primary: #fff;
				--line: #cbd5e1;
				color-scheme: light;
			}
			:root[data-theme='dark'] {
				--bg: #0a101c;
				--fg: #e6ebf2;
				--muted: #96a3b5;
				--primary: #60a5fa;
				--on-primary: #0a101c;
				--line: #334155;
				color-scheme: dark;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				padding: 24px;
				background: var(--bg);
				color: var(--fg);
				font:
					15px/1.4 system-ui,
					-apple-system,
					'Segoe UI',
					Roboto,
					sans-serif;
			}
			h2 {
				margin: 0 0 10px;
				color: var(--muted);
				font-size: 11px;
				letter-spacing: 0.08em;
				text-transform: uppercase;
			}
			.row {
				display: flex;
				flex-wrap: wrap;
				gap: 10px;
				align-items: center;
				margin-bottom: 24px;
			}
			.button {
				display: inline-flex;
				align-items: center;
				gap: 8px;
				height: 40px;
				padding: 0 16px;
				border: 1px solid transparent;
				border-radius: 10px;
				background: var(--primary);
				color: var(--on-primary);
				font: inherit;
				font-weight: 600;
				cursor: pointer;
			}
			.button.is-outline {
				border-color: var(--line);
				background: none;
				color: var(--fg);
			}
			.button.is-ghost {
				background: none;
				color: var(--primary);
			}
			.button.is-small {
				height: 32px;
				padding: 0 12px;
				font-size: 13px;
			}
			.button.is-large {
				height: 48px;
				padding: 0 22px;
				font-size: 16px;
			}
			.button:disabled {
				opacity: 0.45;
				cursor: not-allowed;
			}
		</style>
	</head>
	<body>
		<h2>Kinds</h2>
		<div class="row">
			<button class="button">Save report</button>
			<button class="button is-outline">Add photos</button>
			<button class="button is-ghost">Cancel</button>
		</div>
		<h2>Sizes</h2>
		<div class="row">
			<button class="button is-small">Small</button>
			<button class="button">Medium</button>
			<button class="button is-large">Large</button>
		</div>
		<h2>States</h2>
		<div class="row">
			<button
				class="button"
				disabled
			>
				Disabled
			</button>
			<button
				class="button is-outline"
				disabled
			>
				Disabled
			</button>
		</div>
	</body>
</html>
