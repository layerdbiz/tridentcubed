# Deletes a pull request's head branch once the PR is merged, so nobody has to tap "Delete branch"
# on GitHub. Stands in for the repository setting "Automatically delete head branches", which a
# cloud session cannot switch on. `dev` and `main` are never deleted, and a branch from a fork is
# left alone.
#
# Every run also sweeps branches left behind, so nothing has to be run by hand. A branch goes when
# either holds:
# - its newest PR is merged and the branch still points at the commit that PR merged (a branch
#   someone has pushed to since is kept), or
# - everything it changed is already on dev byte for byte, however it got there (squash, cherry-pick,
#   a copy in another PR), so deleting the name loses nothing. A branch with no commits of its own
#   is kept: it was just cut and will get work.
# The sweep can also be run alone from Actions → delete-merged-branch → Run workflow; tick "dry run"
# to see what it would delete without deleting.
name: delete-merged-branch

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only print what the sweep would delete
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read

jobs:
  delete:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      DRY_RUN: ${{ inputs.dry_run || false }}
    steps:
      - name: Delete the merged PR's head branch
        if: github.event_name == 'pull_request'
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          case "$BRANCH" in
            dev|main) echo "kept: $BRANCH is protected"; exit 0 ;;
          esac
          if gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH"; then
            echo "deleted: $BRANCH"
          else
            echo "already gone: $BRANCH"
          fi

      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0

      - name: Sweep branches left behind by earlier merges
        run: |
          git fetch --quiet --prune origin '+refs/heads/*:refs/remotes/origin/*'
          delete() {
            if [ "$DRY_RUN" = "true" ]; then
              echo "would delete: $1 ($2)"
            elif gh api -X DELETE "repos/$REPO/git/refs/heads/$1" >/dev/null; then
              echo "deleted: $1 ($2)"
            else
              echo "failed to delete: $1"
            fi
          }
          git for-each-ref --format='%(refname:strip=3) %(objectname)' refs/remotes/origin |
          while read -r name sha; do
            case "$name" in
              dev|main|HEAD) continue ;;
            esac

            # 1. The newest PR for the branch merged and nothing was pushed since.
            newest=$(gh api "repos/$REPO/pulls?state=all&head=$OWNER:$name&sort=updated&direction=desc&per_page=1" \
              --jq '.[0] | select(. != null) | "\(.number) \(.state) \(.merged_at // "") \(.head.sha)"' 2>/dev/null || true)
            if [ -n "$newest" ]; then
              set -- $newest
              number=$1 state=$2 merged_at=$3 head_sha=$4
              if [ "$state" = "closed" ] && [ -n "$merged_at" ] && [ "$head_sha" = "$sha" ]; then
                delete "$name" "PR #$number merged"
                continue
              fi
            fi

            # 2. Everything the branch changed is already on dev, byte for byte.
            own=$(git rev-list --count "origin/dev..$sha")
            if [ "$own" = "0" ]; then
              echo "kept: $name has no commits of its own"
              continue
            fi
            base=$(git merge-base origin/dev "$sha")
            if git diff --name-only -z "$base" "$sha" | xargs -0 git diff --quiet origin/dev "$sha" --; then
              delete "$name" "its $own commit(s) are already on dev"
              continue
            fi
            echo "kept: $name has changes dev does not"
          done
