# Makes a release after each push to dev (#157): the team works on dev.app, so what lands on dev is what they get.
# The version comes from the commit titles since the last release (src/lib/releases/releases.utils.ts holds the rule):
# any breaking change is major, else any ✨ feat is minor, else any 🐛 fix or ⚡ perf is patch; with none of those,
# there is no release. A release is two things, both made here, and nothing is committed:
# - the tag v1.1.0 on dev's newest commit, the one record of the version: every build reads it from git;
# - the GitHub release v1.1.0, its notes the same as What's New in the app: each batch of work with its title and
#   words, its new features, improvements and fixes, then the changes outside the app.
# The tag is pushed with the workflow's own token, so it starts no other workflow. The app's build on dev does not
# wait for it: it works the version out by the same rule, so it already says v1.1.0 (releases.server.ts).
#
# The first release waits for Justin's word: until IS_RELEASING in src/lib/releases/releases.utils.ts is true, a push
# to dev with no v* tag makes nothing. Turned on, the push that brings it makes v1.0.0, its notes listing everything
# up to it, the same as What's New. A hand run (Actions → release → Run workflow, or
# `gh api -X POST repos/<owner>/<repo>/actions/workflows/release.yml/dispatches -f ref=dev`) does what a push would,
# or publishes a release whose tag exists without its GitHub release.
#
# Every push to next is a prerelease of the release to come (Justin, 2026-11-27): v1.0.0-next.1, -next.2 and on,
# whatever it holds, each with its tag and a GitHub pre-release (never marked Latest) listing what came since the one
# before; the first lists everything up to it. next.app shows its version and links its notes from What's New. A
# release on dev starts the count again toward the one after it: v1.1.0-next.1.
#
# Easy to swap: the rule is one script with tests, and this file only tags and publishes what it worked out.
name: release

on:
  push:
    branches: [dev, next]
  workflow_dispatch:

# One release at a time on each branch, never cancelled half way. Each run releases the branch as it is then, so a
# push that lands while one runs is either in that release or, when it came too late for it, the next run's.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # The branch as it is now, with the whole history and every tag: the newest commit is the one the app is building.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
      - name: Work out the release
        id: plan
        run: node apps/app/scripts/release.ts --branch "$GITHUB_REF_NAME" --notes "$RUNNER_TEMP/notes.md"
      - name: Tag and publish it
        if: steps.plan.outputs.version != ''
        env:
          TAG: v${{ steps.plan.outputs.version }}
          IS_PRERELEASE: ${{ steps.plan.outputs.prerelease }}
        run: |
          HEAD_COMMIT=$(git rev-parse HEAD)
          if TAGGED=$(git rev-parse --quiet --verify "refs/tags/$TAG^{commit}"); then
            # A tag of this name on another commit means dev's history was replaced: stop rather than guess.
            if [ "$TAGGED" != "$HEAD_COMMIT" ]; then
              echo "::error::$TAG already marks $TAGGED, not $GITHUB_REF_NAME's newest commit $HEAD_COMMIT."
              exit 1
            fi
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag --annotate "$TAG" --message "$TAG" "$HEAD_COMMIT"
            git push origin "refs/tags/$TAG"
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG is published already."
          elif [ "$IS_PRERELEASE" = true ]; then
            gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag --prerelease --latest=false
          else
            gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
          fi
