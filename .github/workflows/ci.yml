# Runs the gate from AGENTS.md "Checks before a PR" and the two Vercel-shaped builds on every push to
# a branch (#130), so no thread re-runs them by hand.
#
# The checks start on the push, not on the pull request (#271). GitHub makes a trial merge of the
# branch into dev before it creates a pull request's runs, and on 2026-11-21 that step stalled: #267's
# checks were created 1 min 56 s after it opened. A push run does not wait for the trial merge and
# starts before the pull request exists; its results show on the pull request through the head commit.
# It tests the branch as pushed, not the branch combined with the newest dev: the run on dev after
# every merge tests the combined result. main takes only promotions from dev, and persist is never
# touched, so neither is checked here.
#
# The gate is the root package.json's `check` script, the same command a thread runs locally
# (`pnpm check`). Here its two halves run side by side instead of one after the other (#254), since
# the tests were 65 to 107 seconds of a 2 to 3 minute run:
# - gate: `pnpm run check:static`, which is format and lint, type checks and the barrels check.
# - test: the packages `pnpm test` covers, the app's tests split over two runners because each of
#   its test files starts a database of its own. apps/site/src/ci.test.ts fails when a package
#   `pnpm test` covers is missing here.
# No build step comes first: the apps alias `@layerd/ui` to the UI source (packages/config/vite), so
# `@layerd/ui/ui.css` resolves without the styles build, and dev stays green on a fresh clone (#129).
#
# build (app) and build (site): `pnpm build` inside the app folder from a clean checkout, the way
# Vercel builds each project, with no `turbo ^build` before it. The 2026-10-03 retro's #86 passed a
# local `turbo build` and failed both previews because the gate's build had a different shape.
#
# Node comes from `engines.node` and pnpm from `packageManager` in the root package.json, so the
# versions live in one place.
name: ci

on:
  push:
    branches: ['**', '!main', '!persist']
  workflow_dispatch:

# A new push to a branch cancels that branch's running checks; a run on dev itself always finishes,
# so a red commit on dev is never hidden by the next merge.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' }}

permissions:
  contents: read

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:static

  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app 1/2
            run: pnpm --filter app test --shard=1/2
          - name: app 2/2
            run: pnpm --filter app test --shard=2/2
          - name: site and ui
            run: pnpm --filter site --filter @layerd/ui test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ${{ matrix.run }}

  build:
    name: build (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [app, site]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the way Vercel does, from the app folder
        working-directory: apps/${{ matrix.app }}
        run: pnpm build
